name: customer-spending-insights

services:
  db:
    image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    environment:
      POSTGRES_DB: customer_insights
      POSTGRES_USER: customer_insights
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_insights -d customer_insights"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: apps/api
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/customer_insights
      DATABASE_USER: customer_insights_api
      DATABASE_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}
      CURSOR_SECRET: ${CURSOR_SECRET:?Set CURSOR_SECRET in .env}
      COOKIE_SECURE: "false"
    depends_on:
      db-provision:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12

  db-migrate:
    image: flyway/flyway:12.4.0@sha256:5be18367a9b3979a9f37234c371b80da457a448fb9577bd94d4bf24d923fafac
    command: ["migrate"]
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/customer_insights
      FLYWAY_USER: customer_insights
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FLYWAY_CONNECT_RETRIES: 10
    volumes:
      - ./apps/api/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

  db-provision:
    image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}
    volumes:
      - ./tools/db/provision.sh:/provision.sh:ro
    entrypoint: ["sh", "/provision.sh"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  db-sim-provision:
    image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    profiles: ["simulator"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SIMULATOR_DB_PASSWORD: ${SIMULATOR_DB_PASSWORD:-}
      SIMULATOR_APPROVED_DATASET_ID: ${SIMULATOR_APPROVED_DATASET_ID:-}
      SIMULATOR_APPROVED_SEED_HASH: ${SIMULATOR_APPROVED_SEED_HASH:-}
      SIMULATOR_APPROVED_EPOCH: ${SIMULATOR_APPROVED_EPOCH:-}
    volumes:
      - ./tools/db/provision-simulator.sh:/provision-simulator.sh:ro
    entrypoint: ["sh", "/provision-simulator.sh"]

  db-sim:
    image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    profiles: ["simulator"]
    environment:
      PGPASSWORD: ${SIMULATOR_DB_PASSWORD:-}
    entrypoint: ["psql", "-X", "-q", "-A", "-t", "-v", "ON_ERROR_STOP=1", "-h", "db", "-U", "customer_insights_simulator", "-d", "customer_insights", "-f", "-"]

  db-import:
    image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    profiles: ["tools"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    entrypoint: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-h", "db", "-U", "customer_insights", "-d", "customer_insights", "-f", "-"]
    depends_on:
      db-provision:
        condition: service_completed_successfully

volumes:
  postgres-data:
