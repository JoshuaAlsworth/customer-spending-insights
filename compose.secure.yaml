services:
  api:
    environment:
      COOKIE_SECURE: "true"
  web:
    ports: !override
      - "127.0.0.1:${CSI_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./.local-certs/${CSI_COMPOSE_PROJECT:?Select a secure Compose project}/server.crt:/etc/nginx/tls/server.crt:ro
      - ./.local-certs/${CSI_COMPOSE_PROJECT:?Select a secure Compose project}/server.key:/etc/nginx/tls/server.key:ro
      - ./apps/web/nginx-secure.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/"]
