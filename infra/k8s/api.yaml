apiVersion: v1
kind: Namespace
metadata:
  name: customer-spending-insights
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-api
  namespace: customer-spending-insights
spec:
  replicas: 2
  selector:
    matchLabels: {app: csi-api}
  template:
    metadata:
      labels: {app: csi-api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: customer-spending-insights-api:latest
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - secretRef: {name: csi-api-db}
          env:
            - name: CURSOR_SECRET
              valueFrom:
                secretKeyRef: {name: csi-api-cursor, key: CURSOR_SECRET}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 750m, memory: 768Mi}
          startupProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: temp, mountPath: /tmp}
      volumes:
        - name: temp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: csi-api
  namespace: customer-spending-insights
spec:
  selector: {app: csi-api}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: csi-api
  namespace: customer-spending-insights
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: customer-spending-insights-api-rate@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: csi-api
                port: {name: http}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-rate
  namespace: customer-spending-insights
spec:
  rateLimit:
    average: 15
    period: 1s
    burst: 30
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: csi-login
  namespace: customer-spending-insights
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: customer-spending-insights-api-rate@kubernetescrd,customer-spending-insights-login-rate@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /api/v1/auth/login
            pathType: Exact
            backend:
              service:
                name: csi-api
                port: {name: http}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: login-rate
  namespace: customer-spending-insights
spec:
  rateLimit:
    average: 1
    period: 1s
    burst: 5
