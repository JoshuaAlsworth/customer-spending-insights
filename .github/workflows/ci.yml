name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: python -m pip install uv==0.11.28
      - run: uv python install 3.14.6
      - name: Prepare isolated database credentials
        run: |
          umask 077
          printf 'POSTGRES_PASSWORD=%s\nAPI_DB_PASSWORD=%s\nCURSOR_SECRET=%s\nSIMULATOR_DB_PASSWORD=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
      - run: ./dev check
      - run: ./dev test
      - run: ./dev build
      - name: Browser account, transaction and simulator checks
        run: |
          CSI_ISOLATED_TEST_DB=1 ./dev fixture csi-ci-browser
          docker compose -p csi-ci-browser up --build -d --wait web
          uv run --no-project --with playwright==1.65.1 python -m playwright install --with-deps chromium
          CSI_COMPOSE_PROJECT=csi-ci-browser uv run --no-project --with playwright==1.65.1 python tools/browser-tests/account_balances.py
          CSI_COMPOSE_PROJECT=csi-ci-browser uv run --no-project --with playwright==1.65.1 python tools/browser-tests/transaction_history.py
          CSI_COMPOSE_PROJECT=csi-ci-browser uv run --no-project --with playwright==1.65.1 python tools/browser-tests/simulator_lifecycle.py
      - name: Remove browser fixture
        if: always()
        run: docker compose -p csi-ci-browser down -v --remove-orphans
