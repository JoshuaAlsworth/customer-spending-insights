openapi: 3.1.0
info:
  title: Customer Spending Insights API
  version: 1.0.0
  description: Same-origin synthetic ZAR customer API. Monetary minor units are canonical signed decimal strings.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /api/v1/auth/csrf:
    get:
      operationId: getCsrf
      security: []
      responses:
        '200':
          description: Sets or renews XSRF-TOKEN cookie for X-XSRF-TOKEN request header.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CsrfResponse'}
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated session; session cookie is HttpOnly.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/Throttled'}
  /api/v1/auth/session:
    get:
      operationId: getSession
      responses:
        '200':
          description: Minimal server-authoritative session state; explicit recheck can extend idle time.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      responses:
        '204': {description: Session invalidated, including safe repeated logout}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/accounts:
    get:
      operationId: getAccounts
      responses:
        '200':
          description: Only owned accounts, including a successful empty list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountsResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/dashboard:
    get:
      operationId: getDashboard
      parameters:
        - name: accountIds
          in: query
          description: Comma-separated distinct owned IDs; omit for all owned accounts.
          schema: {type: string}
        - name: from
          in: query
          schema: {type: string, format: date}
        - name: to
          in: query
          schema: {type: string, format: date}
      responses:
        '200':
          description: Coherent exact posted-entry snapshot for a bounded period.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dashboard'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/transactions:
    get:
      operationId: getTransactions
      description: Contract reserved; this route is not implemented yet.
      parameters:
        - {name: accountIds, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: status, in: query, schema: {type: string, enum: [ALL, PENDING, POSTED, CANCELLED], default: ALL}}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/TransactionType'}}
        - {name: category, in: query, schema: {type: string}}
        - {name: search, in: query, schema: {type: string, minLength: 2, maxLength: 100}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: Forward cursor page, descending effective timestamp then typed ID.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/StaleCursor'}
  /api/v1/transactions/{id}:
    get:
      operationId: getTransaction
      description: Contract reserved; this route is not implemented yet.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^(au|pe)_[A-Za-z0-9_-]+$'}}
      responses:
        '200':
          description: One owned typed activity detail.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activity'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: SESSION}
  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema: {type: string}
  responses:
    BadRequest: {description: Invalid syntax, range or unsupported value, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Unauthenticated: {description: Missing or expired session, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Forbidden: {description: CSRF or forbidden operation, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    NotFound: {description: Non-disclosing absent or inaccessible resource, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    StaleCursor: {description: Valid cursor for an old revision or instance; code STALE_CURSOR, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Throttled: {description: Bounded login attempt limit, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Unavailable: {description: Dependency or admitted-capacity failure, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    MoneyMinor: {type: string, pattern: '^(0|-[1-9][0-9]*|[1-9][0-9]*)$', description: Exact signed integer cents as canonical decimal text}
    TransactionType:
      type: string
      enum: [SALARY_CREDIT, ALLOWANCE_CREDIT, EXTERNAL_RECEIPT, INTEREST_CREDIT, CARD_PURCHASE, DEBIT_ORDER, EXTERNAL_PAYMENT, CASH_WITHDRAWAL, BANK_FEE, SPEND_REFUND, SPEND_REVERSAL, INCOME_REVERSAL, OWN_TRANSFER_OUT, OWN_TRANSFER_IN, OWN_TRANSFER_REVERSAL_OUT, OWN_TRANSFER_REVERSAL_IN]
    CategoryCode:
      type: string
      enum: [HOUSING_UTILITIES, GROCERIES, TRANSPORT_FUEL, FOOD_DINING, SHOPPING, HEALTH, SUBSCRIPTIONS_COMMS, INSURANCE_FIN_SERVICES, EDUCATION, ENTERTAINMENT_LEISURE, CASH_WITHDRAWALS, MONEY_SENT, BANK_FEES, UNCATEGORIZED]
    CsrfResponse:
      type: object
      required: [token]
      additionalProperties: false
      properties: {token: {type: string}}
    LoginRequest:
      type: object
      required: [loginId, password]
      additionalProperties: false
      properties:
        loginId: {type: string, minLength: 1, maxLength: 100}
        password: {type: string, minLength: 1, maxLength: 1024}
    Session:
      type: object
      required: [customerId, displayName, expiresAtEpochMillis]
      additionalProperties: false
      properties:
        customerId: {type: string}
        displayName: {type: string}
        expiresAtEpochMillis: {type: integer, format: int64}
    Account:
      type: object
      required: [id, alias, maskedSuffix, accountKind]
      additionalProperties: false
      properties:
        id: {type: string}
        alias: {type: string}
        maskedSuffix: {type: string, pattern: '^[0-9]{4}$'}
        accountKind: {type: string, enum: [EVERYDAY, SAVINGS, SECONDARY_TRANSACTIONAL]}
    AccountsResponse:
      type: object
      required: [accounts]
      additionalProperties: false
      properties:
        accounts: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/Account'}}
    Scope:
      type: object
      required: [from, to, accountIds]
      additionalProperties: false
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        accountIds: {type: array, items: {type: string}}
    Summary:
      type: object
      required: [incomeMinor, grossSpendingMinor, spendingCreditsMinor, netSpendingMinor, ownAccountFlowMinor, netMovementMinor]
      additionalProperties: false
      properties:
        incomeMinor: {$ref: '#/components/schemas/MoneyMinor'}
        grossSpendingMinor: {$ref: '#/components/schemas/MoneyMinor'}
        spendingCreditsMinor: {$ref: '#/components/schemas/MoneyMinor'}
        netSpendingMinor: {$ref: '#/components/schemas/MoneyMinor'}
        ownAccountFlowMinor: {$ref: '#/components/schemas/MoneyMinor'}
        netMovementMinor: {$ref: '#/components/schemas/MoneyMinor'}
    Category:
      type: object
      required: [categoryCode, displayName, netSpendingMinor]
      additionalProperties: false
      properties:
        categoryCode: {$ref: '#/components/schemas/CategoryCode'}
        displayName: {type: string}
        netSpendingMinor: {$ref: '#/components/schemas/MoneyMinor'}
    Trend:
      type: object
      required: [from, to, netSpendingMinor]
      additionalProperties: false
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        netSpendingMinor: {$ref: '#/components/schemas/MoneyMinor'}
    Dataset:
      type: object
      required: [datasetId, instanceEpoch, customerRevision, referenceDate]
      additionalProperties: false
      properties:
        datasetId: {type: string}
        instanceEpoch: {type: string, format: uuid}
        customerRevision: {type: integer, format: int64}
        referenceDate: {type: string, format: date}
    Dashboard:
      type: object
      required: [scope, summary, categories, trend, dataset]
      additionalProperties: false
      properties:
        scope: {$ref: '#/components/schemas/Scope'}
        summary: {$ref: '#/components/schemas/Summary'}
        categories: {type: array, items: {$ref: '#/components/schemas/Category'}}
        trend: {type: array, items: {$ref: '#/components/schemas/Trend'}}
        dataset: {$ref: '#/components/schemas/Dataset'}
    Authorization:
      type: object
      required: [recordKind, id, accountId, maskedSuffix, merchantName, description, status, type, authorizedAmountMinor, occurredAt, postedAt, amountMinor, effectGroup, categoryCode]
      additionalProperties: false
      properties:
        recordKind: {type: string, const: AUTHORIZATION}
        id: {type: string, pattern: '^au_[A-Za-z0-9_-]+$'}
        accountId: {type: string}
        maskedSuffix: {type: string, pattern: '^[0-9]{4}$'}
        merchantName: {type: [string, 'null']}
        description: {type: string}
        status: {type: string, enum: [PENDING, CANCELLED]}
        type: {type: string, const: CARD_PURCHASE}
        authorizedAmountMinor: {type: string, pattern: '^[1-9][0-9]*$'}
        occurredAt: {type: string, format: date-time}
        postedAt: {type: 'null'}
        amountMinor: {type: 'null'}
        effectGroup: {type: 'null'}
        categoryCode: {type: 'null'}
    PostedEntry:
      type: object
      required: [recordKind, id, accountId, maskedSuffix, merchantName, description, status, type, amountMinor, effectGroup, categoryCode, postedAt, occurredAt, authorizedAmountMinor, authorizationActivityId, originalActivityId]
      additionalProperties: false
      allOf:
        - if: {properties: {effectGroup: {const: SPEND}}}
          then: {properties: {categoryCode: {$ref: '#/components/schemas/CategoryCode'}}}
          else: {properties: {categoryCode: {type: 'null'}}}
        - oneOf:
            - properties: {type: {enum: [SALARY_CREDIT, ALLOWANCE_CREDIT, EXTERNAL_RECEIPT, INTEREST_CREDIT]}, effectGroup: {const: INCOME}, amountMinor: {pattern: '^[1-9][0-9]*$'}}
            - properties: {type: {const: INCOME_REVERSAL}, effectGroup: {const: INCOME}, amountMinor: {pattern: '^-[1-9][0-9]*$'}}
            - properties: {type: {enum: [CARD_PURCHASE, DEBIT_ORDER, EXTERNAL_PAYMENT, CASH_WITHDRAWAL, BANK_FEE]}, effectGroup: {const: SPEND}, amountMinor: {pattern: '^-[1-9][0-9]*$'}}
            - properties: {type: {enum: [SPEND_REFUND, SPEND_REVERSAL]}, effectGroup: {const: SPEND}, amountMinor: {pattern: '^[1-9][0-9]*$'}}
            - properties: {type: {enum: [OWN_TRANSFER_OUT, OWN_TRANSFER_REVERSAL_OUT]}, effectGroup: {const: INTERNAL}, amountMinor: {pattern: '^-[1-9][0-9]*$'}}
            - properties: {type: {enum: [OWN_TRANSFER_IN, OWN_TRANSFER_REVERSAL_IN]}, effectGroup: {const: INTERNAL}, amountMinor: {pattern: '^[1-9][0-9]*$'}}
        - if: {properties: {type: {enum: [SPEND_REFUND, SPEND_REVERSAL, INCOME_REVERSAL, OWN_TRANSFER_REVERSAL_OUT, OWN_TRANSFER_REVERSAL_IN]}}}
          then: {properties: {originalActivityId: {type: string}}}
          else: {properties: {originalActivityId: {type: 'null'}}}
        - if: {properties: {type: {const: CARD_PURCHASE}}}
          else: {properties: {authorizationActivityId: {type: 'null'}, authorizedAmountMinor: {type: 'null'}}}
      properties:
        recordKind: {type: string, const: POSTED_ENTRY}
        id: {type: string, pattern: '^pe_[A-Za-z0-9_-]+$'}
        accountId: {type: string}
        maskedSuffix: {type: string, pattern: '^[0-9]{4}$'}
        merchantName: {type: [string, 'null']}
        description: {type: string}
        status: {type: string, const: POSTED}
        type: {$ref: '#/components/schemas/TransactionType'}
        amountMinor: {$ref: '#/components/schemas/MoneyMinor'}
        effectGroup: {type: string, enum: [INCOME, SPEND, INTERNAL]}
        categoryCode:
          anyOf:
            - {$ref: '#/components/schemas/CategoryCode'}
            - {type: 'null'}
        postedAt: {type: string, format: date-time}
        occurredAt: {type: [string, 'null'], format: date-time}
        authorizedAmountMinor: {type: [string, 'null'], pattern: '^[1-9][0-9]*$'}
        authorizationActivityId: {type: [string, 'null'], pattern: '^au_[A-Za-z0-9_-]+$'}
        originalActivityId: {type: [string, 'null'], pattern: '^pe_[A-Za-z0-9_-]+$'}
    Activity:
      oneOf:
        - {$ref: '#/components/schemas/Authorization'}
        - {$ref: '#/components/schemas/PostedEntry'}
      discriminator:
        propertyName: recordKind
        mapping:
          AUTHORIZATION: '#/components/schemas/Authorization'
          POSTED_ENTRY: '#/components/schemas/PostedEntry'
    ActivityPage:
      type: object
      required: [items, nextCursor, dataset]
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Activity'}}
        nextCursor: {type: [string, 'null']}
        dataset: {$ref: '#/components/schemas/Dataset'}
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        requestId: {type: string}
