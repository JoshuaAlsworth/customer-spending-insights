spring.application.name=customer-spending-insights-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/customer_insights}
spring.datasource.username=${DATABASE_USER:customer_insights_api}
spring.datasource.password=${DATABASE_PASSWORD}
spring.flyway.enabled=false
spring.session.jdbc.initialize-schema=never
spring.session.timeout=15m
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
