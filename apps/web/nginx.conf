limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;
map $status $csi_throttled { default 0; 429 1; }
map $uri $csi_route {
    default other;
    /api/v1/auth/login auth_login;
    ~^/api/v1/ api;
}
log_format csi_security escape=json '{"timestamp":"$time_iso8601","event":"throttled","route":"$csi_route","outcome":"denied","status":$status,"requestId":"$request_id"}';
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json;

server {
    listen 8080;
    limit_req_status 429;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout csi_security if=$csi_throttled;

    location ~ ^/api/v1/auth/login$ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location /api/v1/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location = /api { return 404; }
    location /api/ { return 404; }
    location = /actuator { return 404; }
    location /actuator/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
