[project]
name = "customer-spending-data-generator"
version = "0.0.1"
requires-python = ">=3.14,<3.15"
dependencies = ["argon2-cffi==25.1.0"]

[dependency-groups]
dev = [
    "jsonschema==4.25.1",
    "pytest==8.4.2",
    "pyyaml==6.0.3",
    "ruff==0.14.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
